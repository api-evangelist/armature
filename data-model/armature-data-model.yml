  description: >-
    A recurring problem grouped by root cause and ranked by blast radius, with
    session KPIs, daily pass-rate buckets, cause category, and affected use cases.
  source_tool: list_issues / get_issue
- name: ToolCall
  description: A single instrumented MCP tool invocation (name, timing, outcome, size-capped preview) within a session.
  source_tool: get_session
