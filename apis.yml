aid: armature
name: Armature
description: >-
  Armature is a Y Combinator (Spring 2026) startup building product analytics
  for AI agent sessions. Instead of tracking clicks in a human UI, Armature
  captures how users interact with a product through Claude, ChatGPT, Claude
  Code, Cursor and other agents by way of MCP servers. Drop-in SDKs for
  TypeScript, Python and Go instrument an MCP server, streaming tool names,
  timing, outcomes and size-capped previews (with PII and secrets redacted
  before storage) to Armature, which reconstructs replayable, scored sessions.
  The platform clusters use cases by volume and pass rate, detects issues ranked
  by blast radius, and exposes a read-only hosted MCP server so teams can query
  their own agent-experience analytics from any MCP client. Armature also
  publishes an open "agent-review" Agent Skill that lets agents submit compact,
  privacy-safe experience reports about the software flows they use.
